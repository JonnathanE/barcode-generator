name: Frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/frontend.yml

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Usa la versión fijada en package.json ("packageManager").
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Solo lo que llega al navegador; las herramientas de desarrollo se revisan aparte.
      - name: Auditoría de dependencias de producción
        run: pnpm audit --prod --audit-level high

      - name: Oxlint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Formato (Prettier)
        run: pnpm format:check

      - name: Tests (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build
